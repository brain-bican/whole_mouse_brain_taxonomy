name: Export Taxonomy from TSVs

# Regenerates CAS JSON and RDF from the committed curation_tables TSVs.
# Unlike export_publish.yml, this does not download annotations from Google Sheets.

permissions:
  contents: read # GITHUB_TOKEN is only used to clone; pushes use TDT_TOKEN

on:
  push:
    branches:
      - main
    paths:
      - 'curation_tables/**'
      - '*_project_config.yaml'
  workflow_dispatch:

concurrency:
  group: export-taxonomy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  export_publish:
    runs-on: ubuntu-latest
    strategy:
        matrix:
          python-version: [ '3.10' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          persist-credentials: false # otherwise, the token used is the GITHUB_TOKEN, instead of your personal access token.
          fetch-depth: 0 # otherwise, there would be errors pushing refs to the destination repository.

      - name: Set up Python environment
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tdta cas-tools

      - name: Identify JSON file and Taxonomy ID
        id: set_vars
        run: |
          set -e
          # Locate the first JSON file found in the root directory
          cas_json_file=$(ls *.json 2>/dev/null | head -n 1)
          if [ -z "$cas_json_file" ]; then
            echo "No JSON file found in the repository root." >&2
            exit 1
          fi
          taxonomy_id=$(basename "$cas_json_file" .json)
          echo "cas_json_file=$cas_json_file" >> $GITHUB_OUTPUT
          echo "taxonomy_id=$taxonomy_id" >> $GITHUB_OUTPUT
          echo "Found JSON file: $cas_json_file with taxonomy_id: $taxonomy_id"

      # Builds from the latest remote branch and pushes. If someone pushes to the branch
      # while this runs, the push is rejected and the artifacts are rebuilt from the new
      # remote state, so the pushed JSON/RDF always match the TSVs they sit next to.
      - name: Export, commit and push
        env:
          TDT_TOKEN: ${{ secrets.TDT_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          CAS_JSON_FILE: ${{ steps.set_vars.outputs.cas_json_file }}
          TAXONOMY_ID: ${{ steps.set_vars.outputs.taxonomy_id }}
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${TDT_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          max_attempts=3
          for attempt in $(seq 1 $max_attempts); do
            echo "Attempt $attempt of $max_attempts"
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"

            tdta export -f ./curation_tables -o "$CAS_JSON_FILE" -c ./

            cas cas2rdf --schema bican \
            --data "$CAS_JSON_FILE" \
            --ontology_ns "$TAXONOMY_ID" \
            --ontology_iri "https://purl.brain-bican.org/ontology/$TAXONOMY_ID/" \
            --out "$TAXONOMY_ID.rdf" \
            --exclude_cells

            # Normalize TSVs to LF (safe on Linux runner)
            if compgen -G "curation_tables/*.tsv" > /dev/null; then
              sed -i 's/\r$//' curation_tables/*.tsv || true
              git add curation_tables/*.tsv
            fi

            # Add generated CAS JSON and RDF (if present)
            git add "$CAS_JSON_FILE" "$TAXONOMY_ID.rdf" || true

            # Commit only if there are staged changes
            if git diff --staged --quiet; then
              echo "No changes to commit."
              exit 0
            fi

            git commit -m "chore: regenerate CAS JSON and RDF from TSVs"

            if git push origin "HEAD:$BRANCH"; then
              echo "Pushed to $BRANCH."
              exit 0
            fi

            echo "Push rejected; $BRANCH moved during the run. Rebuilding from the latest state."
          done

          echo "Failed to push after $max_attempts attempts." >&2
          exit 1
